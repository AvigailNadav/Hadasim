<div class="register-container">
  <h2>הרשמת ספק חדש</h2>

  <form [formGroup]="registerForm" (ngSubmit)="register()" novalidate>
    <div class="form-group">
      <label>שם מלא:</label>
      <input formControlName="name" type="text">
      <div *ngIf="submitted && form['name'].errors" class="error">נדרש להזין שם</div>
    </div>

    <div class="form-group">
      <label>מספר טלפון:</label>
      <input formControlName="phoneNumber" type="text">
      <div *ngIf="submitted && form['phoneNumber'].errors" class="error">
        <div *ngIf="form['phoneNumber'].errors['required']">נדרש להזין מספר טלפון</div>
        <div *ngIf="form['phoneNumber'].errors['pattern']">מספר טלפון לא תקין</div>
      </div>
    </div>

    <div class="form-group">
      <label>סיסמה:</label>
      <input formControlName="password" type="password">
      <div *ngIf="submitted && form['password'].errors" class="error">
        <div *ngIf="form['password'].errors['required']">נדרש להזין סיסמה</div>
        <div *ngIf="form['password'].errors['minlength']">הסיסמה חייבת להכיל לפחות 4 תווים</div>
      </div>
    </div>

    <div class="form-group">
      <label>שם החברה:</label>
      <input formControlName="companyName" type="text">
      <div *ngIf="submitted && form['companyName'].errors" class="error">נדרש להזין שם חברה</div>
    </div>
    <button type="submit">הרשמה</button>
  </form>

  <div *ngIf="message" class="message">{{ message }}</div>
</div>
